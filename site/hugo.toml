# Сайт отдаётся по https за TLS-прокси: canonical и sitemap должны
# совпадать с реальным протоколом (относительный baseURL ломал sitemap).
baseURL = "https://pocketdoctor.medclever.com/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
title = "Карманный доктор"
disableKinds = ["taxonomy", "term", "RSS"]

# Лендинги — дословный HTML с живого сайта (контент целиком в content/*.html)
[security]
  allowContent = ['^text/html$']

[languages.ru]
  locale = "ru-RU"
  weight = 1
  contentDir = "content/ru"

[languages.en]
  locale = "en"
  weight = 2
  contentDir = "content/en"
