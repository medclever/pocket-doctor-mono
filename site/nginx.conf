# Конфигурация сервера для собранного статического сайта «Карманный доктор».
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 301 с относительным Location — не ломается за прокси: контейнер слушает :80
    # за TLS-прокси, и абсолютный Location (например /articles/slug → /articles/slug/)
    # получил бы схему http и лишнюю цепочку через редирект прокси.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 1024;

    # Английская версия живёт на /en (без слэша на конце), как на текущем сайте:
    # nginx по умолчанию сделал бы 301 на /en/, а переключатель языков ведёт именно на /en.
    location = /en {
        try_files /en/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Картинки и шрифты меняются редко — отдаём с длительным кэшем.
    location ~* \.(png|jpg|jpeg|gif|ico|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
